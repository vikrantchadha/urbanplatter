{% extends 'base.html' %}

{% block title %}Order Confirmation - {{ RESTAURANT_NAME }}{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="text-center">
        <div class="mb-4">
            <i class="fas fa-check-circle text-success" style="font-size: 80px;"></i>
        </div>
        <h1 class="text-success fw-bold mb-3">Your Order is Confirmed!</h1>
        <p class="lead text-muted mb-5">Thank you for your order.</p>
        
        <div class="card shadow-sm" style="max-width: 500px; margin: 0 auto;">
            <div class="card-body py-4">
                <p class="text-muted mb-2"><strong>Order Number</strong></p>
                <h2 class="text-primary mb-0">#{{ order.id }}</h2>
            </div>
        </div>
        
        <div class="mt-5">
            <a href="{{ url_for('menu') }}" class="btn btn-primary btn-lg px-5">Continue Shopping</a>
        </div>
    </div>
</div>
{% endblock %}
