{% extends "base.html" %}
{% block title %}Reports - Urban Platter{% endblock %}
{% block content %}
<div class="container mt-4">
    <h2><i class="fas fa-chart-bar me-2"></i>Reports</h2>
    <p class="text-muted">Generate and download sales reports</p>

    <div class="row">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0"><i class="fas fa-file-csv me-2"></i>Sales Report</h5>
                </div>
                <div class="card-body">
                    <form id="salesReportForm">
                        <div class="mb-3">
                            <label for="start_date" class="form-label">Start Date</label>
                            <input type="date" class="form-control" id="start_date" name="start_date">
                        </div>
                        <div class="mb-3">
                            <label for="end_date" class="form-label">End Date</label>
                            <input type="date" class="form-control" id="end_date" name="end_date">
                        </div>
                        <div class="d-grid gap-2">
                            <button type="button" class="btn btn-primary" onclick="generateReport('json')">
                                <i class="fas fa-eye me-2"></i>View Report
                            </button>
                            <button type="button" class="btn btn-success" onclick="generateReport('csv')">
                                <i class="fas fa-download me-2"></i>Download CSV
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-info text-white">
                    <h5 class="mb-0"><i class="fas fa-table me-2"></i>Report Preview</h5>
                </div>
                <div class="card-body" id="reportPreview">
                    <p class="text-muted text-center">Select date range and click "View Report" to see data</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function generateReport(format) {
    const startDate = document.getElementById('start_date').value;
    const endDate = document.getElementById('end_date').value;
    
    let url = `/admin/reports/sales?format=${format}`;
    if (startDate) url += `&start_date=${startDate}`;
    if (endDate) url += `&end_date=${endDate}`;
    
    if (format === 'csv') {
        window.location.href = url;
    } else {
        fetch(url)
            .then(response => response.json())
            .then(data => {
                const preview = document.getElementById('reportPreview');
                if (data.length === 0) {
                    preview.innerHTML = '<p class="text-muted text-center">No data found for selected period</p>';
                    return;
                }
                let html = '<table class="table table-sm"><thead><tr><th>Order ID</th><th>Customer</th><th>Date</th><th>Amount</th></tr></thead><tbody>';
                data.forEach(order => {
                    html += `<tr><td>#${order.id}</td><td>${order.customer}</td><td>${new Date(order.date).toLocaleDateString()}</td><td>Rs.${order.amount.toFixed(2)}</td></tr>`;
                });
                html += '</tbody></table>';
                preview.innerHTML = html;
            });
    }
}
</script>
{% endblock %}
